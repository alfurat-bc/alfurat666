version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: murdoch-survey-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=/app/data/survey.db
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-key-change-in-production}
      - BASE_URL=${BASE_URL:-https://your-domain.com}
    volumes:
      - app_data:/app/data
      - ./uploads:/app/uploads
    networks:
      - survey_network

  nginx:
    image: nginx:alpine
    container_name: murdoch-survey-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./dist/client:/usr/share/nginx/html:ro
    depends_on:
      - app
    networks:
      - survey_network

networks:
  survey_network:
    driver: bridge

volumes:
  app_data:
